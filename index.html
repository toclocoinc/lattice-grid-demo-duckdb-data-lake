<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The lake is the database: query Overture Maps Places in place with DuckDB and Lattice Grid</title>
    <meta
      name="description"
      content="81 million places of interest as country-partitioned Parquet, queried where it sits. DuckDB-Wasm opens only the countries a map window touches, reads only the byte ranges a filter needs, and Lattice Grid turns every filter, sort, group and search into SQL."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./node_modules/@toclocoinc/lattice-grid/lattice-grid.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>The lake is the database</h1>
        <div class="load-status" role="status" aria-live="polite">
          <span class="spinner"></span>
          <p class="load-text">Starting. The first visit downloads the query engine, so it takes a moment.</p>
          <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><div class="load-fill"></div></div>
        </div>
      </div>
    </main>
    <script async src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.12/dist.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
